name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: unit tests (exit rules, timing math, parsers, engine threads)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: unit tests on windows (the real raw input / hook code compiles here)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: clippy on macos (the iokit / event tap code only compiles here)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --all-targets
      - name: unit tests on macos
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # unsigned app builds for every os, kept as workflow artifacts (no release is made)
  bundle:
    name: bundle (${{ matrix.name }})
    needs: [rust-linux, rust-windows, rust-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos arm64
            os: macos-latest
            bundles: app
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - name: linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build unsigned bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: zip the mac app (keeps the ad-hoc signature intact)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/inputlab.app src-tauri/target/release/bundle/inputlab-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: inputlab-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/inputlab-macos-arm64.zip
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
